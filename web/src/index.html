<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{web_title}}</title>
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<header>
  <h1>{{web_title}}</h1>
  <select id="session" onchange="onSessionChange(true)"></select>
  <select id="terminal" onchange="onSessionChange(true)"></select>
  <button id="delTerm" class="del-btn" onclick="deleteTerminal()" title="{{web_delete_terminal}}">×</button>
  <label class="tgl"><input type="checkbox" id="showTime" onchange="onShowTimeChange()"> {{web_time}}</label>
  <label class="tgl"><input type="checkbox" id="debugMode" onchange="onDebugModeChange()"> Raw</label>
  <span id="meta"></span>
</header>
<pre id="term">{{web_loading}}</pre>
<button id="toBottom" class="to-bottom-btn" onclick="scrollToNewest()">{{web_new_messages}}</button>
<div id="cmdbar">
  <span id="cmdKey" title="{{web_send_ctrlc}}">Ctrl-C</span>
  <textarea id="cmdInput" rows="1" placeholder="{{web_cmd_placeholder}}"></textarea>
</div>
<script>window.__I18N__ = __I18N_JSON__;</script>
<script>window.__PTY_COLS__ = __PTY_COLS_VAL__;</script>
<script src="/web/app.js"></script>
</body>
</html>
