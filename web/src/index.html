<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{web_title}}</title>
<link rel="stylesheet" href="/web/app.css">
<link rel="stylesheet" href="/web/xterm.css">
</head>
<body>
<header>
  <h1>{{web_title}}</h1>
  <select id="session" onchange="onSessionChange(true)"></select>
  <select id="terminal" onchange="onSessionChange(true)"></select>
  <button id="delTerm" class="del-btn" onclick="deleteTerminal()" title="{{web_delete_terminal}}">×</button>
  <label class="tgl"><input type="checkbox" id="showTime" onchange="onShowTimeChange()"> {{web_time}}</label>
  <label class="tgl" id="rawToggle"><input type="checkbox" id="debugMode" onchange="onDebugModeChange()"> {{web_raw}}</label>
  <span id="meta"></span>
  <button id="transferToggle" class="transfer-toggle" type="button" aria-expanded="false" aria-controls="transferPanel" onclick="toggleTransferPanel()">
    <span>{{web_transfers}}</span>
    <span id="transferCount" class="transfer-count">0</span>
  </button>
  <button id="toBottom" class="to-bottom-btn" onclick="scrollToNewest()">{{web_new_messages}}</button>
</header>
<aside id="transferPanel" class="transfer-panel" aria-label="{{web_transfers}}" hidden>
  <div class="transfer-panel-head">
    <span class="transfer-title">{{web_transfers}}</span>
    <button id="transferClose" class="transfer-close" type="button" aria-label="{{web_close}}" title="{{web_close}}" onclick="toggleTransferPanel()">×</button>
  </div>
  <div id="transferList" class="transfer-list"></div>
</aside>
<pre id="term">{{web_loading}}</pre>
<div id="xt"></div>
<div id="connStatus" class="conn-status"></div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div id="cmdbar">
  <span id="cmdKey"></span>
  <textarea id="cmdInput" rows="1" placeholder="{{web_cmd_placeholder}}"></textarea>
</div>
<script>window.__I18N__ = __I18N_JSON__;</script>
<script>window.__PTY_COLS__ = __PTY_COLS_VAL__;</script>
<script>window.__PTY_ROWS__ = __PTY_ROWS_VAL__;</script>
<script>window.__HEARTBEAT_INTERVAL_MS__ = __HEARTBEAT_INTERVAL_MS_VAL__;</script>
<script>window.__HEARTBEAT_CLIENT_TIMEOUT_MS__ = __HEARTBEAT_CLIENT_TIMEOUT_MS_VAL__;</script>
<script src="/web/app.js"></script>
</body>
</html>
